name: Migraciones Supabase

# Aplica en Supabase las migraciones nuevas de supabase/migrations/ cada vez que llegan a main.
# Necesita el secreto SUPABASE_DB_URL: la cadena "Session pooler" de Supabase (botón Connect),
# con la contraseña de la base en lugar de [YOUR-PASSWORD]. Ver README → Migraciones automáticas.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migraciones.yml"
  workflow_dispatch:

# Nunca dos corridas a la vez contra la misma base.
concurrency:
  group: supabase-migraciones
  cancel-in-progress: false

env:
  # Migraciones que se corrieron a mano en el SQL Editor antes de automatizar: se marcan como
  # aplicadas (es idempotente) para que db push no intente volver a correrlas.
  APLICADAS_A_MANO: "20261126000000 20261127000000 20261128000000"

jobs:
  aplicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar el secreto
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Marcar como aplicadas las migraciones corridas a mano
        run: npx --yes supabase@3.4.0 migration repair --remote="$SUPABASE_DB_URL" --status applied $APLICADAS_A_MANO --yes

      - name: Aplicar migraciones pendientes
        run: npx --yes supabase@3.4.0 db push --remote="$SUPABASE_DB_URL" --yes
